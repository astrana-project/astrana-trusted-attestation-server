; PHP settings the container image adds to public/.user.ini, which it copies into the same php.ini folder.
; PHP reads these only from php.ini itself, never from .user.ini or .htaccess, so on a hosting account
; public/.htaccess and public/web.config get the same result another way.
;
; No answer names PHP's version in an X-Powered-By header, a warning PHP raises while it reads a request
; before any script runs included.
expose_php = Off
