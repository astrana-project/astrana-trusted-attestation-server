sonar.projectKey=astrana-trusted-attestation-server-php
sonar.organization=astrana
sonar.host.url=https://sonarcloud.io

# Analysed sources and tests (paths are relative to projectBaseDir=php, set in the workflow).
sonar.sources=app,resources,routes,config,public,bootstrap
sonar.tests=tests

# Build output, dependencies, and the git-ignored copies synced in from ../shared are not our code.
sonar.exclusions=vendor/**,storage/**,contract/**,schema/**,public/trusted-attestation.css,public/favicon.svg,public/theme-overrides.css,resources/ui-strings.json

# PHPUnit coverage (clover) produced by the workflow's test step.
sonar.php.coverage.reportPaths=coverage.xml
