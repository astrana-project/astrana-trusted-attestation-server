; PHP settings the server needs wherever it runs. PHP reads this file from the public folder when it runs
; through FastCGI, under IIS and with PHP-FPM behind Apache or Nginx. The container image copies it into its
; php.ini folder, and under Apache's PHP module public/.htaccess sets the same values.
;
; An error goes to the log and is never shown to whoever sent the request, a warning PHP raises while it
; reads a request before any script runs included.
display_errors = Off
display_startup_errors = Off
log_errors = On
;
; PHP leaves every request body unread, so that the server reads each one itself, whatever its Content-Type
; and however it is sent, and refuses one over 64 kilobytes. A multipart body would otherwise be read by PHP
; and kept from the server. App\Support\RequestCapture has PHP parse the fields of a posted form.
enable_post_data_reading = Off
