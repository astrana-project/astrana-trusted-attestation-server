# Casdoor as a dev IdP (OIDC only) for the conformance matrix, with its own Postgres (the image has no
# sqlite driver). Casdoor seeds a "built-in" organisation and an "app-built-in" application on first boot.
#
# Casdoor emits the subject (OIDC sub) as the fixed fixture UUID (see configure.py).
services:
  casdoor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: casdoor
      POSTGRES_DB: casdoor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor"]
      interval: 5s
      timeout: 5s
      retries: 20

  casdoor:
    # The digest pins the exact image, Casdoor 4.0.0.
    image: casbin/casdoor:4.0.0@sha256:4fa1e35dd4bf574764cc96d6ef337b7aeb8cee33ba660a964737aae3aab0f397
    depends_on:
      casdoor-db:
        condition: service_healthy
    ports:
      - "8010:8000"
    volumes:
      - ./app.conf:/conf/app.conf:ro
