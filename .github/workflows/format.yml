name: Format

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier (docs, contract, configuration, UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check

  dotnet:
    name: dotnet format (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Astrana.TrustedAttestation.slnx --locked-mode
      - run: dotnet format Astrana.TrustedAttestation.slnx --verify-no-changes --no-restore

  java:
    name: Spotless (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - run: mvn -B -ntp spotless:check

  php:
    name: Pint (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
