# SonarQube Cloud analysis for the .NET implementation. Each implementation has its own SonarQube Cloud project.
#
# The workflow runs on every pull request so that it always reports a result and can be a required check. The
# build, test and analysis steps run only when the change touches dotnet/ or shared/. Every push to master is
# analysed in full.
name: Sonar (.NET)

on:
  push:
    branches: [master]
  pull_request:

# Read access to the code is all the job needs. SonarQube Cloud decorates the pull request with SONAR_TOKEN, not
# the GitHub token.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so Sonar can tell new code from old, and for the path check below

      - name: Check whether this change touches the .NET implementation
        id: scope
        shell: bash
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(dotnet/|shared/|\.github/workflows/sonar-dotnet\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No .NET or shared files changed. Nothing to analyse."
          fi

      - name: Set up JDK (the SonarScanner itself runs on a JVM)
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Set up .NET
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache SonarQube Cloud packages
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        if: steps.scope.outputs.run == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore the packages the lock files name
        if: steps.scope.outputs.run == 'true'
        run: dotnet restore Astrana.TrustedAttestation.slnx --locked-mode

      - name: Build, test and analyse
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Program.cs is the start-up composition root, which the unit coverage rule excludes as framework plumbing.
          # The demonstration is sample data and configuration, not shipped code, so it is not analysed.
          dotnet-sonarscanner begin \
            /k:"astrana-trusted-attestation-server-dotnet" \
            /o:"astrana" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/src/Astrana.TrustedAttestation.Server/Program.cs" \
            /d:sonar.exclusions="demo/**"
          dotnet build --no-incremental --no-restore
          dotnet test --no-restore --settings coverage.runsettings --collect:"XPlat Code Coverage"
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

# Notes:
# - Running from working-directory `dotnet` scopes this project to the dotnet/ subtree (monorepo mode).
#   The other two projects cover java/ and php/.
# - Coverage comes from the coverlet.collector package in the test project, configured by
#   dotnet/coverage.runsettings, which sets the OpenCover format and excludes generated code. If the report
#   lands elsewhere, adjust sonar.cs.opencover.reportsPaths.
# - The shared inputs embedded from ../shared are available because checkout brings the whole repository.
