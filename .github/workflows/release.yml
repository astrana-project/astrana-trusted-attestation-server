# Releases every implementation whose changelog carries a version that is not released yet, on each push to master
# (decision record 44). For each one it pushes the image astrana/ata-<implementation> by its digest alone, signs and
# verifies it, and only then gives it three tags (the full version, MAJOR.MINOR and latest). It then tags the commit
# <implementation>-v<version> and creates a GitHub release with that version's changelog section and the software bill
# of materials.
#
# The workflow skips any version that already has a tag, so a merge releases only the implementations whose version
# changed. Nothing is tagged until both signatures verify, so a failed run never leaves a tag on an unsigned image, and
# the next run tries again.
#
# Each image carries a provenance attestation and a software bill of materials, which BuildKit attaches to the image
# index, and cosign signs the index by its digest with a keyless Sigstore certificate issued to this workflow. That one
# signature covers the image for every platform and both attestations. The software bill of materials attached to the
# release is signed the same way, into sbom.json.sigstore.json beside it. The job then verifies both signatures against
# the identity the installation guides tell users to check, so a missing or wrong signature fails the release.
#
# The image of a release published before signing began can be signed once, from this same workflow, so that its
# signature carries the same identity. In GitHub, open Actions, then Release, then Run workflow. Leave the branch as
# master, enter the version, such as 1.0.0, under "Sign an existing release", and run it. For each implementation the
# sign-existing job checks that the image published under that version was built from the release's own commit, then
# signs the image by digest and verifies the signature. It rebuilds, retags and republishes nothing. An image's
# attestations cannot change without republishing it, so such a release keeps the attestations it was built with and
# gains a signature only. The 1.0.0 images carry BuildKit's provenance attestation, which the new signature covers, but
# no software bill of materials attestation.
#
# Such a release's sbom.json is left unsigned, because the repository's releases are immutable and GitHub accepts no new
# file once a release is published. GitHub's own attestation of each immutable release covers its files instead, and
# `gh release verify-asset` checks it.
#
# Set two repository secrets. DOCKERHUB_USERNAME is the Docker Hub user. DOCKERHUB_TOKEN is a Docker Hub access token
# that can push to the astrana namespace.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sign-existing:
        description: Sign an existing release instead of releasing. Enter its version, such as 1.0.0, or leave it empty.
        required: false
        default: ""
        type: string

permissions:
  contents: read

# The signer the installation guides tell users to check. Verifying against these values, rather than against whatever
# identity this run happens to have, makes a renamed repository, workflow file or branch fail the release until the
# guides are updated.
env:
  SIGNER_IDENTITY_REGEXP: '^https://github\.com/astrana-project/astrana-trusted-attestation-server/\.github/workflows/release\.yml@refs/heads/master$'
  SIGNER_ISSUER: https://token.actions.githubusercontent.com

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ matrix.implementation }})
    # Only master releases. A manual run started from any other branch does nothing, so a feature branch's
    # changelog can never publish an image or create a tag. A manual run with a version to sign runs sign-existing
    # instead.
    if: github.ref == 'refs/heads/master' && !inputs.sign-existing
    runs-on: ubuntu-latest
    # Write access only here, because this job creates the tag and the GitHub release.
    permissions:
      contents: write
      # Lets cosign obtain this workflow's OpenID Connect token, which Sigstore exchanges for a short-lived signing
      # certificate naming this repository and workflow.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        implementation: [dotnet, java, php]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read the version from the changelog
        id: info
        run: python3 .github/scripts/release_info.py ${{ matrix.implementation }} release-notes.md

      - name: Check whether this version is already released
        id: tag
        env:
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/$TAG" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released. Nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the Docker Hub credentials are set
        if: steps.tag.outputs.released == 'false'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish images."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tag.outputs.released == 'false'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.tag.outputs.released == 'false'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Describe the image
        id: meta
        if: steps.tag.outputs.released == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: astrana/ata-${{ matrix.implementation }}
          tags: |
            type=raw,value=${{ steps.info.outputs.version }}
            type=raw,value=${{ steps.info.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Astrana Trusted Attestation Server (${{ steps.info.outputs.title }})
            org.opencontainers.image.version=${{ steps.info.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=The project's own code is licensed under the MIT License. The image also contains third-party components under their own licences. Their notices are in THIRD-PARTY-NOTICES.txt, which the server serves at /THIRD-PARTY-NOTICES.txt, and in the image's own notice files, and they are listed in the image's software bill of materials attestation and in the one attached to the GitHub release.

      # Pushed by digest alone, with no tag, so nobody can pull it by tag until it is signed and verified.
      - name: Build and publish the image
        id: build
        if: steps.tag.outputs.released == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.implementation }}/Dockerfile
          outputs:
            type=image,name=astrana/ata-${{ matrix.implementation }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.implementation }}
          cache-to: type=gha,scope=release-${{ matrix.implementation }},mode=max
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.tag.outputs.released == 'false'

      # Signs by digest, never by tag, so the signature names exactly the image just pushed.
      - name: Sign the image
        if: steps.tag.outputs.released == 'false'
        env:
          IMAGE: astrana/ata-${{ matrix.implementation }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Sign the software bill of materials
        if: steps.tag.outputs.released == 'false'
        env:
          SBOM: ${{ matrix.implementation }}/sbom.json
        run: cosign sign-blob --yes --bundle sbom.json.sigstore.json "$SBOM"

      - name: Verify the signatures
        if: steps.tag.outputs.released == 'false'
        env:
          IMAGE: astrana/ata-${{ matrix.implementation }}@${{ steps.build.outputs.digest }}
          SBOM: ${{ matrix.implementation }}/sbom.json
        run: |
          cosign verify --certificate-identity-regexp "$SIGNER_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$SIGNER_ISSUER" "$IMAGE"
          cosign verify-blob --bundle sbom.json.sigstore.json --certificate-identity-regexp "$SIGNER_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$SIGNER_ISSUER" "$SBOM"

      # Tagging points each tag at the same digest, so the signature covers the tagged image.
      - name: Tag the image
        if: steps.tag.outputs.released == 'false'
        env:
          IMAGE: astrana/ata-${{ matrix.implementation }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE"

      - name: Tag the commit and create the GitHub release
        if: steps.tag.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          TITLE: ${{ steps.info.outputs.title }}
        run: >-
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.md "${{
          matrix.implementation }}/sbom.json#Software bill of materials (CycloneDX)" "sbom.json.sigstore.json#Signature
          of the software bill of materials (Sigstore bundle)"

  sign-existing:
    name: Sign an existing release (${{ matrix.implementation }})
    # Only on a manual run from master with a version entered, so the signature carries the same identity as those made
    # at release.
    if: github.ref == 'refs/heads/master' && inputs.sign-existing
    runs-on: ubuntu-latest
    # Read access to find the release, and the identity token for Sigstore.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        implementation: [dotnet, java, php]
    env:
      VERSION: ${{ inputs.sign-existing }}
      TAG: ${{ matrix.implementation }}-v${{ inputs.sign-existing }}
      IMAGE_NAME: astrana/ata-${{ matrix.implementation }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the version and find the release's commit
        id: release
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Enter a released version as MAJOR.MINOR.PATCH, such as 1.0.0."
            exit 1
          fi
          gh release view "$TAG" > /dev/null
          echo "commit=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The full-version tag is resolved to a digest once, and only that digest is signed. The image for every platform
      # must carry the release's commit as its revision label. That catches a tag moved to a different image by
      # mistake, but anyone with the Docker Hub token could set the label.
      - name: Find the published image and check it was built from the release's commit
        id: image
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" --format '{{ .Manifest.Digest }}')
          # A single-platform image gives one configuration and a multi-platform index gives one per platform. The
          # distinct revisions are listed, so the check passes only when there is one and it is the release's commit.
          revisions=$(docker buildx imagetools inspect "$IMAGE_NAME@$digest" --format '{{ json .Image }}' \
            | jq -r 'if has("config") then [.] else [.[]] end
              | map(.config.Labels["org.opencontainers.image.revision"] // "no revision label") | unique | join(", ")')
          if [ "$revisions" != "$COMMIT" ]; then
            echo "::error::$IMAGE_NAME:$VERSION was built from $revisions, not $TAG at $COMMIT. Nothing was signed."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Verify the signature
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
        run: |
          cosign verify --certificate-identity-regexp "$SIGNER_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$SIGNER_ISSUER" "$IMAGE"
