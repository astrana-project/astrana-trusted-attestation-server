name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/dco_check.py "origin/${{ github.base_ref }}"

  changelog:
    name: Changelog accuracy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # The check's own tests run first, so a change to the check cannot quietly change what it enforces.
      - run: python3 -m unittest discover -s .github/scripts
      - run: python3 .github/scripts/changelog_check.py "origin/${{ github.base_ref }}"
