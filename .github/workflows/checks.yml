name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/dco_check.py "origin/${{ github.base_ref }}"

  changelog:
    name: Changelog accuracy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The check's own tests run first, so a change to the check cannot quietly change what it enforces.
      - run: python3 -m unittest discover -s .github/scripts
      - run: python3 .github/scripts/changelog_check.py "origin/${{ github.base_ref }}"

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tests of the contributor scripts in scripts/, such as the translation review sheet.
      - run: python3 -m unittest discover -s scripts
