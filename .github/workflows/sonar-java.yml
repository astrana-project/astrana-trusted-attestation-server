# SonarQube Cloud analysis for the Java implementation. Each implementation has its own SonarQube Cloud project.
#
# The workflow runs on every pull request so that it always reports a result and can be a required check. The
# build, test and analysis steps run only when the change touches java/ or shared/. Every push to master is
# analysed in full.
name: Sonar (Java)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check whether this change touches the Java implementation
        id: scope
        shell: bash
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(java/|shared/|\.github/workflows/sonar-java\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Java or shared files changed. Nothing to analyse."
          fi

      - name: Set up JDK 25
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Cache SonarQube Cloud packages
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and analyse
        if: steps.scope.outputs.run == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=astrana-trusted-attestation-server-java -Dsonar.organization=astrana
          -Dsonar.host.url=https://sonarcloud.io "-Dsonar.token=$SONAR_TOKEN"

# Notes:
# - `mvn verify` runs the tests, the JaCoCo report and the Spotless check the pom configures. The Sonar Maven
#   plugin picks the JaCoCo XML up automatically.
# - The pom copies the contract, schema and interface files from ../shared at build time. They are available
#   because checkout brings the whole repository and this runs from the java/ module.
