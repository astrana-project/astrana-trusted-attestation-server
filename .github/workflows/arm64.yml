# Builds each image for linux/arm64, without pushing it, when a pull request changes its Dockerfile or anything that
# Dockerfile copies, so a broken arm64 build shows before the pull request merges rather than in the release.
name: Arm64 images

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Images to build
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Each pattern follows what that Dockerfile copies, less what .dockerignore leaves out. A change to shared/,
      # .dockerignore or this workflow builds all three.
      - name: List the images whose inputs changed
        id: images
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git diff --name-only "$BASE...HEAD" \
            | grep -vE '^shared/test(-material)?/|/demo/|/saml/|/tests/|appsettings\.Development\.json$|application-dev' \
            > changed.txt || true
          every='^(\.dockerignore|\.github/workflows/arm64\.yml|shared/)'
          declare -A own=(
            [dotnet]='^dotnet/(Dockerfile|global\.json|build/|src/)'
            [java]='^java/(Dockerfile|pom\.xml|build/|src/)'
            [php]='^php/'
          )
          images=()
          for image in dotnet java php; do
            if grep -qE "$every|${own[$image]}" changed.txt; then images+=("\"$image\""); fi
          done
          echo "images=[$(IFS=,; echo "${images[*]}")]" >> "$GITHUB_OUTPUT"

  build:
    name: Arm64 image (${{ matrix.implementation }})
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        implementation: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner is amd64, so the steps of the image that must run on arm64 run under emulation, as in the release.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The release's build cache is read, never written, so a pull request cannot change what a release builds from.
      - name: Build the image for arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.implementation }}/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=release-${{ matrix.implementation }}
